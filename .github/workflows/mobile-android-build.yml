name: Mobile Android Build

on:
  push:
    branches:
      - feature/notification-bridge
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-android-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  XDT_SKIP_AGENT_BIN_INSTALL: '1'
  NODE_OPTIONS: '--max-old-space-size=8192'
  EXPO_PUBLIC_CINDY_AUTH_REGION: cn

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo Prebuild Android
        run: |
          cp config/endpoint.dev.json.example config/endpoint.dev.json
          cd apps/mobile
          npx expo prebuild --platform android --clean
          node -e "import('./scripts/lib/android-local.mjs').then(m => { const p = 'android/gradle.properties'; import('fs').then(fs => fs.writeFileSync(p, m.patchGradlePropertiesMemory(fs.readFileSync(p, 'utf8'), { xmxMb: 4096, metaspaceMb: 2048 }))) })"
        env:
          EXPO_PUBLIC_CINDY_AUTH_REGION: cn

      - name: Build Android APK
        run: |
          cd apps/mobile/android
          ./gradlew assembleRelease --no-daemon
        env:
          EXPO_PUBLIC_CINDY_AUTH_REGION: cn
          GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=2048m -XX:+HeapDumpOnOutOfMemoryError"'

      - name: Upload Android APK
        uses: actions/upload-artifact@v5
        with:
          name: cindy-android-cn-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
