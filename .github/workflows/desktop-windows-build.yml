name: Desktop Windows Build

on:
  push:
    branches:
      - feature/notification-bridge
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-windows-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The postinstall hook may fetch optional agent binaries. The packaging hook
  # explicitly fetches the only runtime binary required for this build.
  XDT_SKIP_AGENT_BIN_INSTALL: '1'
  NODE_OPTIONS: '--max-old-space-size=8192'
  # This workflow produces the Mainland China desktop package.
  CINDY_AUTH_REGION: cn

jobs:
  build-windows:
    name: Build Windows desktop
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install dependencies and build resources
        run: pnpm install --frozen-lockfile

      - name: Build Windows desktop packages
        run: pnpm --filter desktop build

      - name: Upload Windows desktop packages
        uses: actions/upload-artifact@v5
        with:
          name: cindy-desktop-windows-${{ github.sha }}
          path: apps/desktop/out/make/**
          if-no-files-found: error
          retention-days: 14
